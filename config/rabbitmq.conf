# AMQP listener used by the backend.
listeners.tcp.default = 5672

# Management UI is exposed by Docker Compose on 127.0.0.1:15672 only.
management.tcp.port = 15672

# Conservative defaults for a small Compute Engine VM.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# The chat processor can hold a delivery while waiting on n8n.
consumer_timeout = 1800000

# Keep guest access local-only. Production clients should use RABBITMQ_DEFAULT_USER.
loopback_users.guest = true

